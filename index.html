/* =====================================================================
   WAVES boot loader — splash, OTA updater, game injector.

   UPDATE RULES (as designed):
   - remote version HIGHER than installed  -> download & cache update
   - remote version EQUAL or LOWER         -> keep what is installed
   - offline / server unreachable          -> use cache, else bundled copy

   >>> SET YOUR REPO HERE (the only edit you ever need to make) <<<
===================================================================== */
var CFG = {
  OWNER:  'Repuvlika',      // e.g. 'navalfan'
  REPO:   'waves-game',         // your repository name
  BRANCH: 'main'
};

var LS_V = 'waves.version', LS_H = 'waves.html';
function $(i){return document.getElementById(i)}
function say(m){$('st').textContent=m}
function bar(p){$('b').style.width=Math.round(p*100)+'%'}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null}}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}

/* ---------- semver compare: 1 when a>b, -1 when a<b, 0 equal ---------- */
function semver(a,b){
  a=String(a||'0').split(/[.-]/).map(Number); b=String(b||'0').split(/[.-]/).map(Number);
  for(var i=0;i<3;i++){var x=a[i]||0,y=b[i]||0; if(x>y)return 1; if(x<y)return -1;}
  return 0;
}

/* ---------- sha256 (for verifying downloaded updates) ---------- */
function sha256Hex(ascii){
  function rrot(v,n){return (v>>>n)|(v<<(32-n))}
  ascii=unescape(encodeURIComponent(ascii));
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
         0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
         0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
         0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
         0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
         0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
         0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
         0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var l=ascii.length, words=[], i;
  for(i=0;i<l;i++) words[i>>2]=(words[i>>2]||0)|(ascii.charCodeAt(i)<<(24-(i%4)*8));
  words[l>>2]=(words[l>>2]||0)|(0x80<<(24-(l%4)*8));
  var n=((l+8)>>6)+1, bitLen=l*8;
  words=new Array(n*16).fill(0).map(function(_,ix){return words[ix]||0});
  words[n*16-1]=bitLen;
  var w=new Array(64);
  for(i=0;i<n;i++){
    var j;
    for(j=0;j<16;j++) w[j]=words[i*16+j];
    for(j=16;j<64;j++){
      var s0=rrot(w[j-15],7)^rrot(w[j-15],18)^(w[j-15]>>>3);
      var s1=rrot(w[j-2],17)^rrot(w[j-2],19)^(w[j-2]>>>10);
      w[j]=(w[j-16]+s0+w[j-7]+s1)|0;
    }
    var a=H[0],b=H[1],c=H[2],d2=H[3],e=H[4],f=H[5],g=H[6],h2=H[7];
    for(j=0;j<64;j++){
      var S1=rrot(e,6)^rrot(e,11)^rrot(e,25);
      var ch=(e&f)^(~e&g);
      var t1=(h2+S1+ch+K[j]+w[j])|0;
      var S0=rrot(a,2)^rrot(a,13)^rrot(a,22);
      var mj=(a&b)^(a&c)^(b&c);
      var t2=(S0+mj)|0;
      h2=g;g=f;f=e;e=(d2+t1)|0;d2=c;c=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d2)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h2)|0;
  }
  return H.map(function(x){return ('00000000'+((x>>>0).toString(16))).slice(-8)}).join('');
}

function xhr(url){
  return new Promise(function(res,rej){
    try{
      var x=new XMLHttpRequest();
      x.open('GET',url);
      x.timeout=8000;
      x.onload=function(){ (x.status===200||x.status===0)&&x.responseText ? res(x.responseText) : rej(new Error('http '+x.status)); };
      x.onerror=function(){rej(new Error('network'))};
      x.ontimeout=function(){rej(new Error('timeout'))};
      x.send();
    }catch(e){rej(e)}
  });
}
function tfetch(url,ms){
  return new Promise(function(res,rej){
    var done=false;
    var t=setTimeout(function(){ if(!done){done=true;rej(new Error('timeout'))} },ms||6000);
    fetch(url+'?t='+Date.now(),{cache:'no-store'}).then(function(r){
      if(done)return; done=true; clearTimeout(t);
      r.ok? res(r) : rej(new Error('http '+r.status));
    }).catch(function(e){ if(!done){done=true;clearTimeout(t);rej(e)} });
  });
}

function bases(){
  return [
    'https://raw.githubusercontent.com/'+CFG.OWNER+'/'+CFG.REPO+'/'+CFG.BRANCH+'/',
    'https://cdn.jsdelivr.net/gh/'+CFG.OWNER+'/'+CFG.REPO+'@'+CFG.BRANCH+'/'
  ];
}

async function main(){
  bar(.05); say('Reading cache…');
  var localV = ls(LS_V), localH = ls(LS_H);
  $('v').textContent = localV? 'installed v'+localV : 'bundled copy';

  if(CFG.OWNER && CFG.OWNER.indexOf('YOUR-')!==0 && navigator.onLine!==false){
    bar(.15); say('Checking for updates…');
    var remote=null, usedBase=null;
    for(var bi=0; bi<bases().length && !remote; bi++){
      try{ var r=await tfetch(bases()[bi]+'updates/latest.json',6000); remote=await r.json(); usedBase=bases()[bi]; }catch(e){}
    }
    if(remote && remote.version){
      if(!localV || semver(remote.version, localV)===1){
        bar(.3); say('Downloading v'+remote.version+'…');
        try{
          var url = usedBase + (remote.url||'game.html');
          var html = await xhr(url);
          if(remote.sha256){
            bar(.6); say('Verifying…');
            if(sha256Hex(html)!==remote.sha256) throw new Error('checksum mismatch');
          }
          ls(LS_H, html); ls(LS_V, remote.version);
          localH = html; localV = remote.version;
          say('Updated to v'+remote.version);
          bar(.85); await sleep(350);
        }catch(e){ say('Update failed — using installed copy'); await sleep(600); }
      } else {
        say('Already up to date (v'+localV+')');
        bar(.7); await sleep(300);
      }
    } else {
      say('Offline — using installed copy');
      bar(.7); await sleep(300);
    }
  } else {
    bar(.5);

  bar(.9); say('Loading game…');
  var html = localH;
  if(!html){
    try{ html = await xhr('game.html'); ls(LS_V,'bundled'); }catch(e){}
  }
  if(!html){ say('Error: game file not found'); return; }

  bar(1);
  await sleep(200);
  document.open(); document.write(html); document.close();
}

main();
