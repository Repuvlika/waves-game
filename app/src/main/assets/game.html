<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05080c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WAVES">
<title>WAVES — Naval Shipyard Tycoon</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="%2305080c"/><path d="M10 46c4-5 9-5 12-2M26 46c4-5 9-5 12-2M42 46c4-5 9-5 12-2" stroke="%234db8ff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M16 34h32l-5 8H21z" fill="%234db8ff"/><rect x="30" y="26" width="4" height="8" fill="%238fd0ff"/><rect x="34" y="27" width="14" height="3" fill="%238fd0ff"/></svg>'>
<style>
:root{
  --bg:#05080c; --bg2:#090e14; --panel:#121922; --panel2:#1a232e; --panel3:#222d39;
  --line:#233040; --line2:#2e3d4f;
  --tx:#d9e4ef; --mu:#7e92a6; --dim:#54687c;
  --acc:#4db8ff; --acc2:#8fd0ff; --accd:#2a7ab5;
  --ok:#4dd88f; --warn:#ffb84d; --bad:#ff6b5e;
  --rad:14px; --rad2:10px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0; height:100%}
body{background:var(--bg); color:var(--tx); font:15px/1.45 -apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; overflow:hidden;
  padding-top:env(safe-area-inset-top,0px)}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0}
input,select{font:inherit; color:var(--tx); background:var(--bg2); border:1px solid var(--line); border-radius:var(--rad2); padding:9px 12px; outline:none; width:100%}
input:focus{border-color:var(--accd)}
h1,h2,h3{margin:0; font-weight:700; color:var(--acc); letter-spacing:.12em; text-transform:uppercase}
.mu{color:var(--mu)} .dim{color:var(--dim)}
.acc{color:var(--acc)} .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
::-webkit-scrollbar{width:4px; height:4px} ::-webkit-scrollbar-thumb{background:var(--line2); border-radius:2px}

/* ============ screens & layout ============ */
.screen{display:none; height:calc(100dvh - env(safe-area-inset-top,0px)); overflow:hidden}
.screen.on{display:flex; flex-direction:column}
.scroll{overflow-y:auto; -webkit-overflow-scrolling:touch; min-height:0; flex:1}

/* ============ main menu ============ */
#scr-menu{align-items:center; justify-content:center; background:
  radial-gradient(1200px 500px at 50% 115%, #0c1622 0%, var(--bg) 62%)}
.menu-in{width:min(440px,88vw); text-align:center; animation:fadeUp .7s ease both}
.logo-svg{width:min(300px,70vw); height:auto; display:block; margin:0 auto 6px}
.gametitle{font-size:clamp(44px,13vw,64px); font-weight:800; letter-spacing:.3em; text-indent:.3em; color:var(--acc);
  text-shadow:0 0 26px rgba(77,184,255,.35); margin:2px 0 4px}
.gametitle small{display:block; font-size:11px; letter-spacing:.42em; color:var(--mu); font-weight:600; margin-top:6px; text-indent:.42em}
.menu-btns{display:flex; flex-direction:column; gap:12px; margin-top:34px}
.mbtn{border:1px solid var(--line2); border-radius:16px; padding:15px; font-size:15px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--tx);
  background:linear-gradient(180deg,var(--panel),var(--bg2)); transition:.2s}
.mbtn:active{transform:scale(.97)}
.mbtn.pri{border-color:var(--acc); color:var(--acc); box-shadow:0 0 18px rgba(77,184,255,.12)}
.mbtn:disabled{opacity:.35; pointer-events:none}
.verline{margin-top:26px; font-size:11px; letter-spacing:.2em; color:var(--dim)}

/* ============ generic cards & chips ============ */
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--rad); padding:14px}
.chip{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line2); border-radius:20px; padding:3px 10px; font-size:11px; letter-spacing:.06em; color:var(--mu); white-space:nowrap}
.chip.acc{color:var(--acc); border-color:var(--accd)}
.chip.ok{color:var(--ok); border-color:#2a6e4a}
.chip.bad{color:var(--bad); border-color:#77332e}
.chip.warn{color:var(--warn); border-color:#7a5a26}

/* ============ buttons ============ */
.btn{border:1px solid var(--line2); background:var(--panel2); color:var(--tx); border-radius:12px; padding:11px 16px; font-size:13.5px; letter-spacing:.08em; transition:.18s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--acc); color:#03121f; font-weight:700; border-color:var(--acc)}
.btn.acc{border-color:var(--acc); color:var(--acc)}
.btn.bad{border-color:#77332e; color:var(--bad)}
.btn:disabled{opacity:.35; pointer-events:none}
.btn.sm{padding:7px 11px; font-size:12px; border-radius:9px}
.btnrow{display:flex; gap:10px; flex-wrap:wrap}

/* ============ top bar ============ */
.topbar{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); background:var(--bg2); flex:none; min-height:58px}
.topbar .tt{font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--acc); font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topbar .spacer{flex:1}
.iconb{width:40px; height:40px; border:1px solid var(--line); border-radius:11px; display:grid; place-items:center; color:var(--mu); flex:none; background:var(--panel)}
.iconb:active{background:var(--panel3)}
.iconb svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}

/* ============ hub ============ */
.hubstats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:12px 12px 4px; flex:none}
.hstat{background:var(--panel); border:1px solid var(--line); border-radius:var(--rad2); padding:8px 10px}
.hstat span{display:block; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--mu)}
.hstat b{display:block; font-size:14.5px; font-weight:600; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tabbar{display:flex; gap:4px; padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); background:var(--bg2); flex:none; overflow-x:auto}
.tabbar button{flex:1; min-width:64px; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 4px; border-radius:11px; color:var(--mu); font-size:10.5px; letter-spacing:.06em}
.tabbar button svg{width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.tabbar button.on{color:var(--acc); background:var(--panel)}
.hubpane{display:none; padding:12px} .hubpane.on{display:block}
.sec{margin:0 0 14px}
.sec>h3{font-size:12.5px; margin-bottom:10px; letter-spacing:.16em}

/* ============ lists / rows ============ */
.row{display:flex; align-items:center; gap:10px; padding:11px 0; border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1; min-width:0}
.row b{font-weight:600; font-size:14px; display:block}
.row .sub{font-size:12px; color:var(--mu)}
.tag{font-size:10.5px; color:var(--dim); letter-spacing:.08em; text-transform:uppercase}
.empty{border:1px dashed var(--line2); border-radius:var(--rad); padding:22px 16px; text-align:center; color:var(--mu); font-size:13px}

/* progress dots for decade */
.dots{display:flex; gap:6px; flex-wrap:wrap}
.dots i{width:16px; height:8px; border-radius:4px; background:var(--panel3); display:block}
.dots i.on{background:var(--acc)}
.timeline{display:flex; align-items:center; gap:2px; margin:10px 0 4px; flex-wrap:wrap}
.timeline i{flex:1; min-width:8px; height:5px; border-radius:3px; background:var(--panel3)}
.timeline i.past{background:var(--accd)} .timeline i.cur{background:var(--acc); box-shadow:0 0 8px rgba(77,184,255,.5)}
.tl-label{display:flex; justify-content:space-between; font-size:10px; color:var(--dim); letter-spacing:.08em}

/* ============ country select ============ */
.cty{display:flex; gap:13px; align-items:center; width:100%; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:var(--rad); padding:14px; margin-bottom:11px; transition:.15s}
.cty:active{border-color:var(--acc)}
.cty .fl{width:46px; height:32px; flex:none; border-radius:4px; overflow:hidden; border:1px solid var(--line2)}
.cty .fl svg{width:100%; height:100%; display:block}
.cty b{font-size:15.5px; letter-spacing:.06em}
.cty .sub{font-size:12px; color:var(--mu); margin-top:3px; line-height:1.4}

/* ============ designer ============ */
#scr-design .steps{display:flex; gap:6px; padding:9px 10px; overflow-x:auto; border-bottom:1px solid var(--line); background:var(--bg2); flex:none}
#scr-design .steps button{flex:none; border:1px solid var(--line); border-radius:9px; padding:8px 13px; font-size:12px; letter-spacing:.06em; color:var(--mu); background:var(--panel)}
#scr-design .steps button.on{color:#03121f; background:var(--acc); border-color:var(--acc); font-weight:700}
.design-grid{display:grid; grid-template-rows:auto 1fr auto; min-height:0; flex:1}
.viewwrap{position:relative; height:clamp(230px,40dvh,420px); background:linear-gradient(180deg,#071019 0%, #050a10 100%); border-bottom:1px solid var(--line); padding:6px 6px 0}
.viewwrap svg{width:100%; height:100%; display:block}
.vtabs{position:absolute; left:10px; top:10px; display:flex; gap:6px; z-index:3}
.vtabs button{border:1px solid var(--line2); background:rgba(5,10,16,.8); color:var(--mu); border-radius:8px; padding:6px 12px; font-size:11px; letter-spacing:.1em}
.vtabs button.on{color:var(--acc); border-color:var(--acc)}
.vlabel{position:absolute; right:12px; top:12px; font-size:10px; letter-spacing:.16em; color:var(--dim); text-transform:uppercase; z-index:3}
@media(min-width:820px){
  .design-grid{grid-template-columns:minmax(0,1fr) minmax(340px,460px); grid-template-rows:1fr auto}
  .viewwrap{border-bottom:0; border-right:1px solid var(--line); height:auto}
  .panelwrap{grid-column:2; grid-row:1/3}
  .bottombar{grid-column:1; grid-row:2}
}
.panelwrap{overflow-y:auto; padding:14px; min-height:0; -webkit-overflow-scrolling:touch}
.bottombar{flex:none; border-top:1px solid var(--line); background:var(--bg2); padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}

/* controls */
.ctl{margin-bottom:15px}
.ctl .lab{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px}
.ctl .lab span{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--mu)}
.ctl .lab b{font-size:14px; font-weight:600; color:var(--tx)}
input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:5px; border-radius:3px; background:var(--panel3); border:0; padding:0; margin:6px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--acc); border:3px solid #06121d; box-shadow:0 0 0 1px var(--accd)}
input[type=range]::-moz-range-thumb{width:18px; height:18px; border-radius:50%; background:var(--acc); border:0}
.optgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(105px,1fr)); gap:7px}
.optgrid button{border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:9px 8px; font-size:12px; text-align:left; color:var(--tx); line-height:1.3; transition:.15s}
.optgrid button small{display:block; color:var(--mu); font-size:10.5px; margin-top:2px}
.optgrid button.on{border-color:var(--acc); color:var(--acc); background:rgba(77,184,255,.08)}
.optgrid button:disabled{opacity:.3}
.optgrid button.locked small::after{content:" 🔒"; font-size:9px}

/* stats & ratings */
.statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:10px}
.statgrid .st{background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:7px 9px}
.statgrid .st span{display:block; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--mu)}
.statgrid .st b{display:block; font-size:13.5px; font-weight:600; margin-top:1px; white-space:nowrap}
.rate{display:grid; grid-template-columns:76px 1fr 30px; gap:8px; align-items:center; padding:3px 0; font-size:11.5px}
.rate span{color:var(--mu); letter-spacing:.08em; text-transform:uppercase; font-size:10px}
.rate .bar{height:6px; background:var(--panel3); border-radius:3px; overflow:hidden}
.rate .bar i{display:block; height:100%; background:var(--acc); border-radius:3px; transition:width .35s ease}
.rate b{text-align:right; font-weight:600; font-size:12px}
.warnbox{margin-top:10px; display:flex; flex-direction:column; gap:6px}
.warnline{border-radius:9px; padding:8px 11px; font-size:12px; line-height:1.35; border:1px solid}
.warnline.bad{color:#ffc9c3; border-color:#77332e; background:rgba(255,107,94,.07)}
.warnline.warn{color:#ffe3b8; border-color:#7a5a26; background:rgba(255,184,77,.07)}
.warnline.ok{color:#c8f2da; border-color:#2a6e4a; background:rgba(77,216,143,.07)}

/* ============ modals & toasts ============ */
#modal{position:fixed; inset:0; background:rgba(2,5,9,.78); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; backdrop-filter:blur(3px)}
#modal.on{display:flex}
.mbox{width:min(460px,94vw); max-height:82dvh; overflow-y:auto; background:var(--panel); border:1px solid var(--line2); border-radius:18px; padding:20px; animation:fadeUp .3s ease both}
.mbox h3{margin-bottom:10px; font-size:14px}
#toasts{position:fixed; left:0; right:0; bottom:calc(74px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; align-items:center; gap:8px; z-index:60; pointer-events:none}
.toast{background:var(--panel2); border:1px solid var(--line2); border-radius:12px; padding:10px 18px; font-size:13px; max-width:88vw; animation:fadeUp .3s ease both; box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.ok{border-color:#2a6e4a} .toast.bad{border-color:#77332e}

@keyframes fadeUp{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
@keyframes waveMove{0%,100%{transform:translateX(0)} 50%{transform:translateX(-14px)}}
@keyframes waveMove2{0%,100%{transform:translateX(-10px)} 50%{transform:translateX(6px)}}
.wv1{animation:waveMove 5s ease-in-out infinite}
.wv2{animation:waveMove2 7s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.wv1,.wv2{animation:none}}
.flag-svg{display:inline-block; vertical-align:middle}
.mono{font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<!-- ============ MAIN MENU ============ -->
<section id="scr-menu" class="screen on">
  <div class="menu-in">
    <svg class="logo-svg" viewBox="0 0 320 190" aria-label="WAVES logo">
      <defs>
        <linearGradient id="lg-hull" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#16324a"/><stop offset="1" stop-color="#0a1622"/>
        </linearGradient>
      </defs>
      <!-- cannon smoke -->
      <g opacity=".5" fill="#8fd0ff">
        <circle cx="268" cy="62" r="5"/><circle cx="280" cy="54" r="7"/><circle cx="293" cy="60" r="4"/>
      </g>
      <!-- hull -->
      <path d="M55 122 L265 122 L244 152 Q160 162 76 152 Z" fill="url(#lg-hull)" stroke="#4db8ff" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- deck line -->
      <line x1="62" y1="122" x2="258" y2="122" stroke="#8fd0ff" stroke-width="1.5" opacity=".7"/>
      <!-- turret + cannon -->
      <path d="M150 122 v-13 q0-6 8-6 h44 q8 0 8 6 v13 z" fill="#12263a" stroke="#4db8ff" stroke-width="2"/>
      <rect x="209" y="99" width="46" height="7" rx="3.5" fill="#8fd0ff" transform="rotate(-7 209 103)"/>
      <!-- muzzle flash -->
      <path d="M252 90 l14-8 -6 12 12-2 -10 9" fill="none" stroke="#ffb84d" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- mast -->
      <line x1="100" y1="122" x2="100" y2="64" stroke="#4db8ff" stroke-width="2.5"/>
      <line x1="100" y1="80" x2="84" y2="94" stroke="#4db8ff" stroke-width="1.6"/>
      <line x1="100" y1="80" x2="116" y2="94" stroke="#4db8ff" stroke-width="1.6"/>
      <circle cx="100" cy="62" r="3.5" fill="#ffb84d"/>
      <!-- pennant -->
      <path d="M100 64 h26 l-7 6 7 6 h-26 z" fill="#ff6b5e"/>
      <!-- waves -->
      <g stroke="#4db8ff" stroke-width="3" fill="none" stroke-linecap="round">
        <path class="wv1" d="M18 168 q14-10 28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0"/>
        <path class="wv2" d="M6 180 q14-9 28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0" opacity=".55"/>
      </g>
    </svg>
    <div class="gametitle">WAVES<small>NAVAL SHIPYARD · 1850 — 1940</small></div>
    <div class="menu-btns">
      <button class="mbtn pri" id="btn-new">New Campaign</button>
      <button class="mbtn" id="btn-continue">Continue</button>
      <button class="mbtn" id="btn-import">Import Save</button>
      <button class="mbtn" id="btn-about">About &amp; Help</button>
    </div>
    <div class="verline" id="menu-ver"></div>
  </div>
</section>

<!-- ============ COUNTRY SELECT ============ -->
<section id="scr-country" class="screen">
  <div class="topbar">
    <button class="iconb" onclick="UI.go('menu')"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="tt">Choose Your Nation</div>
  </div>
  <div class="scroll" style="padding:14px">
    <p class="mu" style="font-size:13px; margin:2px 0 14px">It is 1850. Iron is replacing oak, steam is replacing sail. Pick the nation whose navy will forge its fleet in your yards.</p>
    <div id="cty-list"></div>
  </div>
</section>

<!-- ============ HUB ============ -->
<section id="scr-hub" class="screen">
  <div class="topbar">
    <div style="min-width:0">
      <div class="tt" id="hub-yard">Yard</div>
      <div class="mu" style="font-size:11px; letter-spacing:.08em" id="hub-date"></div>
    </div>
    <div class="spacer"></div>
    <div style="text-align:right">
      <div class="acc mono" style="font-weight:700" id="hub-money"></div>
      <div class="dim" style="font-size:10.5px; letter-spacing:.1em" id="hub-decade"></div>
    </div>
    <button class="iconb" onclick="UI.openMenu()" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </div>
  <div class="hubstats">
    <div class="hstat"><span>Reputation</span><b id="hs-rep">0</b></div>
    <div class="hstat"><span>Research RP</span><b id="hs-rp">0</b></div>
    <div class="hstat"><span>Staff</span><b id="hs-staff">0</b></div>
    <div class="hstat"><span>Payroll</span><b id="hs-pay">0</b></div>
  </div>
  <div class="scroll" id="hub-body">
    <div class="hubpane on" id="pane-overview"></div>
    <div class="hubpane" id="pane-contracts"></div>
    <div class="hubpane" id="pane-yard"></div>
    <div class="hubpane" id="pane-fleet"></div>
    <div class="hubpane" id="pane-market"></div>
    <div class="hubpane" id="pane-log"></div>
  </div>
  <div class="tabbar" id="hub-tabs"></div>
</section>

<!-- ============ DESIGNER ============ -->
<section id="scr-design" class="screen">
  <div class="topbar">
    <button class="iconb" onclick="DES.leave()"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div style="min-width:0; flex:1">
      <div class="tt" id="des-title">New Design</div>
      <div class="mu" style="font-size:11px" id="des-sub"></div>
    </div>
  </div>
  <div class="steps" id="des-steps"></div>
  <div class="design-grid">
    <div class="viewwrap">
      <div class="vtabs">
        <button id="vt-side" class="on" onclick="DES.setView('side')">Side</button>
        <button id="vt-top" onclick="DES.setView('top')">Deck</button>
      </div>
      <div class="vlabel" id="vlabel">Profile</div>
      <svg id="ship-svg" viewBox="0 0 1000 340" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="panelwrap" id="des-panel"></div>
    <div class="bottombar" id="des-bottom"></div>
  </div>
</section>

<!-- ============ MODAL / TOASTS ============ -->
<div id="modal"><div class="mbox" id="modal-box"></div></div>
